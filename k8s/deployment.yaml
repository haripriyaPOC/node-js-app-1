apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-services
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-services
  template:
    metadata:
      labels:
        app: hello-services
    spec:
      containers:
        - name: hello-services
          image: haripriya1310/nodejs1-backend:v1
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: hello-services
spec:
  selector:
    app: hello-services
  ports:
    - port: 80
      targetPort: 3000
  type: NodePort
